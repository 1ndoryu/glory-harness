## sccache delante de rustc, con el tope global de sccache (10 GB, variable de usuario SCCACHE_CACHE_SIZE).
##
## La purga horaria de C:\tmp borra los targets de compilacion, asi que sin
## cache compartida cada rebuild vuelve a compilar desde cero. El gate ejecuta
## sus etapas con un entorno saneado (allowlist de toolRunner.js), de modo que
## RUSTC_WRAPPER no sobrevive desde el shell: la via que si sobrevive es este
## archivo, y es justo lo que comprueba la etapa `sccache` del gate
## (scripts/quality/sentinel-sccache.mjs).
# Sin target-dir a propósito: un valor fijo lo comparte entre checkouts (worktrees)
# y solo existe en el portátil. La VPS (scripts/remoto/rcargo.mjs) pasa
# CARGO_TARGET_DIR=<CM_TARGET_BASE>/<proyecto>_<rama>, uno por checkout.
[build]
rustc-wrapper = "sccache"
