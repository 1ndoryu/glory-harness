[package]
name = "glory-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI y daemon de Glory Harness (run one-shot, daemon SSE en loopback)."

[[bin]]
name = "glory-harness"
path = "src/main.rs"

[dependencies]
glory-harness-core = { path = "../core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# TUI enriquecida (Fase 5, opción B): paneles, scroll y markdown ligero.
# Se usa solo con `chat --tui`; el REPL lineal sigue siendo el default.
ratatui = "0.29"
crossterm = "0.28"