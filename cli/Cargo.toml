[package]
name = "glory-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI y daemon de Glory Harness (run one-shot, daemon SSE en loopback)."

[[bin]]
name = "glory-harness"
path = "src/main.rs"

[lib]
name = "glory_harness"
path = "src/lib.rs"

[dependencies]
glory-harness-core = { path = "../core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# TUI enriquecida (Fase 5, opción B sobre el híbrido C): bloques por turno,
# streaming en vivo, tools inline y scroll (estilo opencode-ligero). Se usa
# solo con `chat --tui`; el REPL lineal sigue siendo el default.
ratatui = "0.29"

# web_fetch (Bloque 3, F1): cliente HTTP mínimo con rustls (sin openssl).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
crossterm = "0.28"
unicode-width = "0.1"

# [069A-2 F1] Servidor HTTP loopback del modo web (`glory-harness web`):
# axum para las rutas HTTP/SSE, tokio-stream para envolver el canal SSE y
# tower-http para servir la UI compilada desde el mismo proceso (sin CORS).
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs"] }

# [069A-2 F2] Solo tests: `oneshot` para probar el router sin socket.
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }