[package]
name = "glory-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI y daemon de Glory Harness (run one-shot, daemon SSE en loopback)."

[[bin]]
name = "glory-harness"
path = "src/main.rs"

[dependencies]
glory-harness-core = { path = "../core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }