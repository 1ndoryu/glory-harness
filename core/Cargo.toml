[package]
name = "glory-harness-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Núcleo de IA agnóstico extraíble: runtime de agente, traits de puertos, tools agnósticas, providers LLM."

[lib]
name = "glory_harness_core"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tracing = "0.1"
futures-util = { version = "0.3", features = ["sink"] }